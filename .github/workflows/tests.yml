name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where provider launch differs most: one command-line string instead of an
        # argument list, and npm's claude.cmd shim adds cmd.exe parsing (issue #3).
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install zsh for terminal syntax checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit tests and offline evals
        shell: bash
        run: >-
          ./gradlew --no-daemon
          test
          autocompleteDeterministicEval
          autocompleteExpectationsEval
          terminalDeterministicEval
          autocompleteProviderModelSafetyGate
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/autocomplete-expectations/
          retention-days: 14
